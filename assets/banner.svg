<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Shield Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 52px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 22px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #e2e8f0; }

    /* Dynamic / Animated elements */
    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.7; transform: scale(1.02); }
      100% { opacity: 0.3; transform: scale(0.98); }
    }
    @keyframes float-slow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    .animated-pulse { animation: pulse 6s infinite ease-in-out; transform-origin: center; }
    .animated-float { animation: float-slow 4s infinite ease-in-out; }
  </style>

  <!-- Dark Tech Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/>

  <!-- Background Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Background Dynamic Glowing Orbs (Behind text & graphics) -->
  <circle cx="150" cy="100" r="180" fill="#3b82f6" opacity="0.15" class="animated-pulse" filter="blur(40px)"/>
  <circle cx="1050" cy="300" r="150" fill="#10b981" opacity="0.15" class="animated-pulse" filter="blur(40px)"/>

  <!-- Dynamic Security Scanning Wave Graphics (Right Side Background Graphic) -->
  <g transform="translate(850, 70)" class="animated-float">
    <!-- Shield Outline -->
    <path d="M100 20 L220 70 V170 C220 250 100 310 100 310 C100 310 -20 250 -20 170 V70 Z" fill="none" stroke="url(#cyan-grad)" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
    <!-- Lock Icon -->
    <rect x="70" y="140" width="60" height="50" rx="8" fill="url(#emerald-grad)" opacity="0.8"/>
    <path d="M80 140 V120 C80 100 120 100 120 120 V140" fill="none" stroke="#67e8f9" stroke-width="6" stroke-linecap="round"/>
    <circle cx="100" cy="160" r="5" fill="#ffffff"/>
    <path d="M100 165 V175" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- Foreground Content: Main Header & Subtitle -->
  <g transform="translate(80, 140)">
    <!-- Security Tag Pill -->
    <g transform="translate(0, -55)">
      <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="6" fill="#10b981" class="animated-pulse"/>
      <text x="32" y="21" class="badge-text" fill="#38bdf8">SECURITY &amp; PRIVACY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="25" class="title">Awesome Data Loss Prevention</text>
    
    <!-- Subtitle -->
    <text x="0" y="70" class="subtitle">Curated Cloud DLP Platforms, PII Redaction &amp; Data Security Ecosystem</text>

    <!-- Feature Badges Flow -->
    <g transform="translate(0, 110)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#334155" opacity="0.8"/>
      <text x="15" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#38bdf8">🔒 Cloud DLP</text>

      <!-- Badge 2 -->
      <rect x="150" y="0" width="160" height="34" rx="8" fill="#334155" opacity="0.8"/>
      <text x="165" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#34d399">🛡️ PII Masking</text>

      <!-- Badge 3 -->
      <rect x="320" y="0" width="170" height="34" rx="8" fill="#334155" opacity="0.8"/>
      <text x="335" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#f472b6">🔑 Secret Scanning</text>

      <!-- Badge 4 -->
      <rect x="500" y="0" width="150" height="34" rx="8" fill="#334155" opacity="0.8"/>
      <text x="515" y="22" font-family="system-ui" font-size="13" font-weight="600" fill="#fbbf24">🤖 GenAI Guard</text>
    </g>
  </g>
</svg>
